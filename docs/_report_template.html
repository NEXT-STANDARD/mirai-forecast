<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未来レーダー Phase 1 検証レポート（第2回）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --paper:#F5F7FA;
  --surface:#FFFFFF;
  --surface-2:#EEF1F6;
  --ink:#141922;
  --ink-soft:#4B5563;
  --ink-faint:#6B7280;
  --rule:#DCE1E9;
  --rule-strong:#C3CBD7;
  --accent:#1B3A6B;
  --accent-soft:#E7EDF6;
  --p0:#A3231A;  --p0-bg:#FBEBEA;
  --p1:#8A5A00;  --p1-bg:#FBF2E2;
  --p2:#1B3A6B;  --p2-bg:#E7EDF6;
  --p3:#5C6672;  --p3-bg:#EDEFF3;
  --good:#1F6F4A; --good-bg:#E6F2EC;
  --shadow:0 1px 2px rgba(20,25,34,.05), 0 8px 24px -12px rgba(20,25,34,.18);
  --font-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --font-data:"JetBrains Mono","SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1219;
    --surface:#161B24;
    --surface-2:#1D232E;
    --ink:#E8EBF1;
    --ink-soft:#A3AEBD;
    --ink-faint:#8590A0;
    --rule:#272E3A;
    --rule-strong:#39414F;
    --accent:#8FB3E0;
    --accent-soft:#1B2635;
    --p0:#F08A80;  --p0-bg:#2B1917;
    --p1:#E0B15C;  --p1-bg:#2A2216;
    --p2:#8FB3E0;  --p2-bg:#18222F;
    --p3:#98A2AF;  --p3-bg:#1C222B;
    --good:#6FC79B; --good-bg:#132420;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1219;
  --surface:#161B24;
  --surface-2:#1D232E;
  --ink:#E8EBF1;
  --ink-soft:#A3AEBD;
  --ink-faint:#8590A0;
  --rule:#272E3A;
  --rule-strong:#39414F;
  --accent:#8FB3E0;
  --accent-soft:#1B2635;
  --p0:#F08A80;  --p0-bg:#2B1917;
  --p1:#E0B15C;  --p1-bg:#2A2216;
  --p2:#8FB3E0;  --p2-bg:#18222F;
  --p3:#98A2AF;  --p3-bg:#1C222B;
  --good:#6FC79B; --good-bg:#132420;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16.5px;
  line-height:1.85;
  /* この監査で指摘している日本語組版設定を、このページ自身に適用している */
  word-break:auto-phrase;
  line-break:strict;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
@supports not (word-break:auto-phrase){ body{word-break:normal} }

.wrap{max-width:1080px;margin:0 auto;padding:0 24px 96px}
.col{max-width:74ch}
h1,h2,h3,h4{font-family:var(--font-ui);text-wrap:balance;line-height:1.4;margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

/* ---------- ヘッダー ---------- */
.masthead{border-bottom:1px solid var(--rule);background:var(--surface);margin-bottom:44px}
.masthead-in{max-width:1080px;margin:0 auto;padding:44px 24px 36px}
.eyebrow{
  font-family:var(--font-data);font-size:11.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);display:flex;gap:14px;flex-wrap:wrap;align-items:center
}
.eyebrow .sep{width:1px;height:11px;background:var(--rule-strong)}
h1{font-size:clamp(28px,4.6vw,42px);font-weight:900;letter-spacing:-.01em;margin:14px 0 12px}
.dek{font-size:17px;color:var(--ink-soft);max-width:62ch;margin:0}

/* ---------- 計測ストリップ ---------- */
.metrics{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;
  overflow:hidden;margin:0 0 52px
}
.metric{background:var(--surface);padding:18px 18px 16px;display:flex;flex-direction:column;gap:3px}
.metric .val{font-family:var(--font-data);font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.metric .val small{font-size:14px;font-weight:400;color:var(--ink-faint);margin-left:2px}
.metric .lbl{font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.metric.bad .val{color:var(--p0)}
.metric.warn .val{color:var(--p1)}

/* ---------- セクション ---------- */
section{margin:0 0 68px;scroll-margin-top:24px}
.sec-head{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:28px}
.sec-num{font-family:var(--font-data);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em}
h2{font-size:clamp(20px,2.6vw,25px);font-weight:900;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700;margin:38px 0 12px}
p{margin:0 0 18px}
.lead{font-size:17px;color:var(--ink-soft)}

/* ---------- 指摘カード ---------- */
.finding{
  background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--rail,var(--p2));
  border-radius:8px;padding:20px 22px;margin:0 0 14px;box-shadow:var(--shadow)
}
.finding.p0{--rail:var(--p0)} .finding.p1{--rail:var(--p1)}
.finding.p2{--rail:var(--p2)} .finding.p3{--rail:var(--p3)}
.f-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.fid{font-family:var(--font-data);font-size:12px;font-weight:700;color:var(--ink-faint);letter-spacing:.04em}
.chip{
  font-family:var(--font-data);font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:3px 8px;border-radius:4px;white-space:nowrap
}
.chip.p0{color:var(--p0);background:var(--p0-bg)}
.chip.p1{color:var(--p1);background:var(--p1-bg)}
.chip.p2{color:var(--p2);background:var(--p2-bg)}
.chip.p3{color:var(--p3);background:var(--p3-bg)}
.chip.ok{color:var(--good);background:var(--good-bg)}
.f-title{font-family:var(--font-ui);font-size:16.5px;font-weight:700;line-height:1.55;width:100%}
.finding p{margin:0 0 10px;font-size:15.5px;line-height:1.8;color:var(--ink-soft)}
.finding p:last-child{margin-bottom:0}
.finding strong{color:var(--ink);font-weight:700}
code{
  font-family:var(--font-data);font-size:.87em;background:var(--surface-2);
  padding:1.5px 5px;border-radius:4px;color:var(--ink);word-break:break-all
}
.evidence{
  font-family:var(--font-data);font-size:12.5px;line-height:1.75;color:var(--ink-soft);
  background:var(--surface-2);border-radius:6px;padding:11px 13px;margin:12px 0 0;
  overflow-x:auto;white-space:pre-wrap
}
.evidence b{color:var(--ink)}

/* ---------- 意図 vs 実測 ---------- */
.spread{border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:0 0 32px;background:var(--surface)}
.spread-row{display:grid;grid-template-columns:minmax(140px,1.4fr) 1fr 1fr;gap:0;border-top:1px solid var(--rule)}
.spread-row:first-child{border-top:none}
.spread-row.head{background:var(--surface-2)}
.spread-row.head div{
  font-family:var(--font-data);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);padding:9px 14px
}
.spread-row > div{padding:13px 14px;font-size:14.5px;line-height:1.6;border-left:1px solid var(--rule)}
.spread-row > div:first-child{border-left:none;color:var(--ink-soft);font-size:14px}
.spread .want{font-family:var(--font-data);color:var(--ink-soft)}
.spread .got{font-family:var(--font-data);color:var(--p0);font-weight:700}

/* ---------- ロードマップ ---------- */
.phase{border:1px solid var(--rule);border-radius:10px;background:var(--surface);margin:0 0 18px;overflow:hidden;box-shadow:var(--shadow)}
.phase-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 20px;border-bottom:1px solid var(--rule);background:var(--surface-2)}
.phase-tag{font-family:var(--font-data);font-size:14px;font-weight:700;letter-spacing:.04em}
.phase.p0 .phase-tag{color:var(--p0)} .phase.p1 .phase-tag{color:var(--p1)}
.phase.p2 .phase-tag{color:var(--p2)} .phase.p3 .phase-tag{color:var(--p3)}
.phase-when{font-family:var(--font-data);font-size:12px;color:var(--ink-faint);margin-left:auto}
.phase-title{font-family:var(--font-ui);font-weight:700;font-size:16px}
.tasks{list-style:none;margin:0;padding:6px 0}
.tasks li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:11px 20px;border-top:1px solid var(--rule);align-items:start}
.tasks li:first-child{border-top:none}
.tasks .ref{font-family:var(--font-data);font-size:11.5px;font-weight:700;color:var(--ink-faint);padding-top:5px;white-space:nowrap}
.tasks .txt{font-size:15px;line-height:1.75}
.tasks .txt em{font-style:normal;display:block;font-size:13.5px;color:var(--ink-faint);margin-top:3px}

/* ---------- 良い点 ---------- */
.keeps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:0 0 24px}
.keep{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--good);border-radius:8px;padding:16px 18px}
.keep h4{font-size:15px;font-weight:700;margin-bottom:6px}
.keep p{font-size:14px;margin:0;color:var(--ink-soft);line-height:1.75}

/* ---------- 補足 ---------- */
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 18px;border-radius:0 6px 6px 0;margin:0 0 24px}
.note p{margin:0;font-size:14.5px;color:var(--ink-soft)}
.note p + p{margin-top:9px}

.toc{
  display:flex;flex-wrap:wrap;gap:8px;margin:0 0 44px;padding:0;list-style:none
}
.toc a{
  display:inline-block;font-family:var(--font-data);font-size:12px;font-weight:700;
  text-decoration:none;color:var(--ink-soft);background:var(--surface);
  border:1px solid var(--rule);border-radius:100px;padding:6px 13px;line-height:1.5
}
.toc a:hover{border-color:var(--accent);color:var(--accent)}

footer{border-top:1px solid var(--rule);padding-top:22px;color:var(--ink-faint);font-size:13.5px}
footer p{margin:0 0 6px}

@media (max-width:640px){
  body{font-size:16px}
  .wrap,.masthead-in{padding-left:18px;padding-right:18px}
  .spread-row{grid-template-columns:1fr}
  .spread-row > div{border-left:none;border-top:1px solid var(--rule)}
  .spread-row > div:first-child{border-top:none;font-weight:700;color:var(--ink)}
  .spread-row.head{display:none}
  .tasks li{grid-template-columns:1fr;gap:3px}
  .tasks .ref{padding-top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>
/* 検証レポート固有の追加スタイル */
.verdict{--rail:var(--p3)}
.verdict.ok{--rail:var(--good)} .verdict.partial{--rail:var(--p1)} .verdict.fail{--rail:var(--p0)}
.chip.ok{color:var(--good);background:var(--good-bg)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin:0 0 40px}
.tally div{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:3px}
.tally .v{font-family:var(--font-data);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.tally .v small{font-size:13px;font-weight:400;color:var(--ink-faint);margin-left:3px}
.tally .l{font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.tally .ok .v{color:var(--good)} .tally .pt .v{color:var(--p1)} .tally .ng .v{color:var(--p0)}
table.cmp{width:100%;border-collapse:collapse;font-size:14.5px;margin:0 0 26px;background:var(--surface);
  border:1px solid var(--rule);border-radius:8px;overflow:hidden}
table.cmp th,table.cmp td{padding:9px 13px;border-top:1px solid var(--rule);text-align:left;line-height:1.6}
table.cmp thead th{background:var(--surface-2);border-top:none;font-family:var(--font-data);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
table.cmp td.num{font-family:var(--font-data);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.cmp td.good{color:var(--good);font-weight:700} table.cmp td.bad{color:var(--p0);font-weight:700}
.tblwrap{overflow-x:auto;margin:0 0 26px}
.tblwrap table.cmp{margin:0;min-width:520px}
.newissue{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--p0);
  border-radius:8px;padding:19px 21px;margin:0 0 14px;box-shadow:var(--shadow)}
.newissue .f-title{font-family:var(--font-ui);font-size:16.5px;font-weight:700;line-height:1.55;width:100%}
.newissue p{margin:0 0 10px;font-size:15.5px;line-height:1.8;color:var(--ink-soft)}
.newissue p:last-child{margin-bottom:0}
.newissue strong{color:var(--ink);font-weight:700}
.selfcheck{border-left:3px solid var(--p1);background:var(--p1-bg);padding:14px 18px;border-radius:0 6px 6px 0;margin:0 0 26px}
.selfcheck p{margin:0;font-size:14.5px;color:var(--ink-soft)}
ul.plain{margin:0 0 20px;padding-left:1.3em}
ul.plain li{font-size:15.5px;line-height:1.8;color:var(--ink-soft);margin-bottom:7px}
ul.plain li strong{color:var(--ink)}
ol.steps{margin:0 0 26px;padding-left:1.4em}
ol.steps li{font-size:15.5px;line-height:1.8;color:var(--ink-soft);margin-bottom:9px}
ol.steps li strong{color:var(--ink)}
</style>
