name: MiraiRadar Daily Topic Council Generator (AI評議会 毎朝自動起案)

on:
  schedule:
    # 毎朝 07:00 JST (前日 22:00 UTC) に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  generate-daily-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run AI Editorial Council (Gemini 3.7 Flash)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/council_topic_generator.mjs
