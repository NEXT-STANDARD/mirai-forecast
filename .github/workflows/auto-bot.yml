name: MiraiRadar Auto Sync & Tweet Bot

on:
  schedule:
    # 30分ごとに実行
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      inject_failure:
        description: '同期の書き込み先を到達できないアドレスに差し替えて失敗させる（終了コードと通知の確認用。DB にも X にも届かない）'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # AR-7: 失敗の通知を issue で起票する
  actions: read   # 通知に失敗したステップ名を載せる

jobs:
  sync-and-tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic fonts-vlgothic

      - name: Install dependencies
        run: npm ci

      # AR-7: 同期は致命的な失敗で非0終了する。そのとき後続の再ビルドは走らない（失敗した同期で本番を作り直さない）
      - name: Run Polymarket Sync to Supabase
        env:
          VITE_SUPABASE_URL: ${{ inputs.inject_failure && 'http://127.0.0.1:9' || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync_polymarket_cron.mjs

      # Twitter 乖離警報ステップは 2026-10-23 に停止（AR-1：票0件の銘柄を「日本世論 50%」として投稿していた）。
      # 再開は表示の既定値50（票が無い銘柄の値）を直してから

      - name: Trigger Cloudflare Pages Rebuild (Prerender Sync)
        if: ${{ env.CF_PAGES_DEPLOY_HOOK != '' }}
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          echo "🚀 Triggering Cloudflare Pages Deploy Hook to prerender newly synced markets..."
          curl -s -X POST "$CF_PAGES_DEPLOY_HOOK"

      # AR-7: 失敗を人に届ける。30分ごとの cron なので、開いた issue への追記は間引く
      - name: Notify failure
        if: ${{ failure() }}
        uses: ./.github/actions/notify-failure
